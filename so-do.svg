<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#60836c"/></marker><style>text{font-family:Arial,sans-serif;fill:#214633} .box{fill:#fff;stroke:#a9bfa5;stroke-width:1.5} .line{fill:none;stroke:#60836c;stroke-width:2;marker-end:url(#a)} .title{font-size:24px;font-weight:bold} .h{font-size:17px;font-weight:bold} .p{font-size:14px} .label{font-size:13px;fill:#607560}</style></defs>
<rect width="1100" height="680" fill="#f5f7ef"/><text x="45" y="48" class="title">CỔNG ĐĂNG KÝ NGÀY HỘI VIỆC LÀM</text><text x="45" y="75" class="label">CSE3051 · Buổi 3 · Mã sinh viên 23110198</text>
<rect class="box" x="45" y="115" width="260" height="110" rx="12"/><text x="65" y="148" class="h">React + Vite</text><text x="65" y="177" class="p">http://localhost:5173</text><text x="65" y="203" class="p">Nhập ma_sv · chọn ma_phien</text>
