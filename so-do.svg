<rect x="120" y="460" width="290" height="110" rx="12" fill="#e6f3e5" stroke="#9abd98"/><text x="140" y="496" class="h">HTTP 201 · {ok: true}</text><text x="140" y="528" class="p">Giao diện: Đăng ký thành công</text>
<rect x="435" y="460" width="300" height="110" rx="12" fill="#fff3d9" stroke="#d8ba72"/><text x="455" y="496" class="h">HTTP 409 · DA_DANG_KY</text><text x="455" y="528" class="p">Giao diện: Bạn đã đăng ký phiên này</text>
<rect x="760" y="460" width="295" height="110" rx="12" fill="#ffeaea" stroke="#d6a4a4"/><text x="780" y="496" class="h">HTTP 422 · Validation error</text><text x="780" y="528" class="p">Giao diện: Kiểm tra lại dữ liệu</text>
<text x="45" y="620" class="p">Trạng thái ban đầu: Chưa gửi → Đang gửi → Thành công / Đã đăng ký / Lỗi.</text><text x="45" y="648" class="label">UNIQUE đảm bảo chống trùng cả khi gửi đồng thời; dữ liệu SQLite tồn tại qua lần khởi động sau.</text>
