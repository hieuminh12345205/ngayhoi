<rect class="box" x="420" y="115" width="280" height="110" rx="12"/><text x="440" y="148" class="h">FastAPI + CORSMiddleware</text><text x="440" y="177" class="p">localhost:8000/api/dang-ky</text><text x="440" y="203" class="p">Origin: http://localhost:5173</text>
<path class="line" d="M700 170H790"/>
<rect class="box" x="790" y="115" width="265" height="110" rx="12"/><text x="810" y="148" class="h">Pydantic: DangKy</text><text x="810" y="177" class="p">ma_sv, ma_phien bắt buộc</text><text x="810" y="203" class="p">Kiểm tra dữ liệu gửi lên</text>
