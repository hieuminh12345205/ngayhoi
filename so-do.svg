<rect class="box" x="420" y="255" width="320" height="125" rx="12"/><text x="440" y="288" class="h">SQLite: ngayhoi.db</text><text x="440" y="319" class="p">INSERT có tham số</text><text x="440" y="349" class="p">UNIQUE(ma_sv, ma_phien)</text>
